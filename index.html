<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vaibhav Jaiswal - Professional Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    /* Reset & Base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Poppins', sans-serif;
      color: #2b1d1d;
      background: linear-gradient(135deg, #ff7e5f, #feb47b); /* Sunset 🌇 */
      min-height: 100vh;
    }

    /* Container Panels (Glass) */
    .panel {
      max-width: 1100px;
      margin: 28px auto;
      padding: 26px;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .8s ease, transform .8s ease;
    }
    .panel.visible { opacity: 1; transform: translateY(0); }

    h1, h2, h3 { letter-spacing: 0.2px; }
    h2 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      color: #a83232; /* Sunset red */
      position: relative;
    }
    h2 i { margin-right: 8px; }
    h2::after {
      content: "";
      display: block;
      width: 64px;
      height: 3px;
      background: #ffb347; /* Warm highlight */
      margin-top: 8px;
      border-radius: 3px;
    }
    p { line-height: 1.7; }
    ul { padding-left: 20px; line-height: 1.8; }

    /* Navbar */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 12px 18px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 6px 10px;
      border-radius: 6px;
      transition: background 0.3s ease, color 0.3s ease;
      text-align: center;
    }

    nav a:hover {
      background: rgba(255, 140, 105, 0.4); /* Sunset glow */
    }

    /* Mobile Navbar */
    @media (max-width: 768px) {
      nav {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        justify-items: center;
        align-items: center;
      }
      nav a {
        width: 100%;
        font-size: 0.85rem;
        padding: 8px 6px;
      }
    }

    /* Header */
    .hero {
      max-width: 1100px;
      margin: 22px auto 0;
      padding: 18px;
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 20px;
      align-items: center;
    }
    .profile-pic {
      width: 140px; height: 140px; border-radius: 50%;
      object-fit: cover; border: 4px solid rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.25);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      transition: transform .35s ease, box-shadow .35s ease;
    }
    .profile-pic:hover { transform: scale(1.03); box-shadow: 0 12px 28px rgba(0,0,0,0.25); }
    .hero .meta h1 { font-size: 2.2rem; font-weight: 600; color: #2c1810; }
    .hero .meta p.tagline { margin-top: 4px; opacity: 0.85; color: #5a2c2c; }
    .quick-links { margin-top: 10px; display: flex; gap: 12px; }
    .quick-links a {
      display: inline-flex; align-items: center; gap: 8px;
      text-decoration: none; color: #fff; font-weight: 500;
      background: linear-gradient(90deg, #ff7e5f, #feb47b);
      border: none;
      padding: 8px 14px; border-radius: 10px;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .quick-links a:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.2); }

    /* Certifications */
    .cert-card {
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.4);
    }
    .cert-card i { color: #ff7043; }

    /* Project gallery */
    .image-gallery img {
      background: #fff;
      border: 2px solid rgba(255, 200, 170, 0.7);
    }

    /* Buttons inside project panels */
    .project a {
      background: linear-gradient(90deg, #ff7043, #ffb347);
      color: #fff !important;
      font-weight: 500;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .project a:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 18px;
      margin: 32px 0;
      color: #2c1810;
      opacity: 0.85;
    }
  </style>
</head>
<body>
